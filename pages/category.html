<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/category.css" />
    <link rel="stylesheet" href="../assets/css/component/card.css" />
    <link rel="stylesheet" href="../assets/css/component/header.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <script type="module" src="../assets/scripts/category.js"></script>

    <title>Categorias - WebDobra</title>
  </head>
  <body>
    <header></header>

    <main>
      <!-- Seção 1: Categorias -->
      <section
        id="categories-section"
        class="catalog-section"
        aria-label="Categorias de Origami"
      >
        <header>
          <h2>Categorias de Origami</h2>
        </header>
        <ul id="categories-container" class="grid">
          <!-- Gerado dinamicamente via JS -->
        </ul>
      </section>

      <!-- Seção 2: Origamis -->
      <section
        id="origamis-section"
        class="catalog-section hidden"
        aria-labelledby="category-title"
      >
        <header>
          <button
            id="back-to-categories"
            class="btn"
            aria-label="Voltar às categorias"
          >
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
            <span class="btn-text">Voltar às Categorias</span>
          </button>
          <h2 id="category-title">Origamis da Categoria</h2>
        </header>

        <ul id="origamis-container" class="grid">
          <!-- Gerado dinamicamente via JS -->
        </ul>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 WebDobra. All rights reserved.</p>
    </footer>
  </body>
</html>
