<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../assets/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../assets/css/tutorial.css" />
    <link
      rel="stylesheet"
      href="../assets/css/component/origami_simple_fold.css"
    />
    <link rel="stylesheet" href="../assets/css/component/carrosel.css" />
    <link rel="stylesheet" href="../assets/css/component/header.css" />

    <script type="module" src="../assets/scripts/tutorial.js"></script>
    <title>Tutorial - WebDobra</title>
  </head>
  <body>
    <header><!-- Renderizado dinamicamente por js--></header>

    <main class="container main-content narrow">
      <header class="tutorial-header">
        <article class="tutorial-intro">
          <div class="tutorial-text">
            <h2 id="tutorial-title"></h2>
            <p id="tutorial-description"></p>
          </div>

          <figure>
            <img id="tutorial-main-image" src="" alt="" />
          </figure>
        </article>

        <section class="tutorial-meta">
          <h3>O que precisa?</h3>
          <ul>
            <li><strong>Folha:</strong> <span id="meta-folha"></span></li>
            <li><strong>Tempo:</strong> <span id="meta-tempo"></span></li>
            <li>
              <strong>Dificuldade:</strong>
              <span id="meta-dificuldade"></span>
            </li>
          </ul>
        </section>

        <aside
          id="tutorial-video-container"
          aria-label="Vídeo do tutorial completo"
          style="display: none"
        ></aside>
      </header>

      <section
        id="tutorial-steps-container"
        class="tutorial-steps"
        aria-label="Passos do tutorial"
      ></section>

      <footer id="tutorial-sources-container" class="tutorial-sources">
        <h3>Fontes e Referências</h3>
        <ul id="tutorial-sources-list"></ul>
      </footer>
    </main>

    <footer>
      <p>&copy; 2026 WebDobra. All rights reserved.</p>
    </footer>
  </body>
</html>
